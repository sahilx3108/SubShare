services:
  db:
    image: postgres:16-alpine
    container_name: subshare-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: subshare
      POSTGRES_PASSWORD: subshare
      POSTGRES_DB: subshare
    ports:
      - "5433:5432"
    volumes:
      - subshare_pgdata:/var/lib/postgresql/data

volumes:
  subshare_pgdata:
